name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: python -m pip install -e "./services/api[dev]"
      - run: python -m ruff check services/api/app services/api/tests
      - run: python -m pytest services/api/tests
      - name: Parse migration syntax
        run: python -c "from pathlib import Path; from pglast import parse_sql; [parse_sql(p.read_text()) for p in Path('supabase/migrations').glob('*.sql')]"

  hosted-database:
    if: github.event_name == 'push' && vars.RUN_HOSTED_SUPABASE_TESTS == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check hosted-test configuration
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_ID"
      - name: Verify tenant schema and RLS
        run: |
          npm exec supabase -- db query --project-ref "$SUPABASE_PROJECT_ID" --file supabase/tests/tenant_isolation.sql
          npm exec supabase -- db query --project-ref "$SUPABASE_PROJECT_ID" --file supabase/tests/rls_cross_tenant.sql
