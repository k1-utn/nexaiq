[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "nexaiq-api"
version = "0.1.0"
description = "Tenant-scoped nexaIQ decision-support API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "pypdf==6.19.0",
  "python-multipart==0.0.32",
  "structlog==26.1.0",
  "uvicorn[standard]==0.53.0"
]

[project.optional-dependencies]
dev = [
  "pglast==8.4",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
