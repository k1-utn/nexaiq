[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nexaiq-api"
version = "0.1.0"
description = "Tenant-scoped nexaIQ decision-support API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "pypdf==6.1.1",
  "python-multipart==0.0.20",
  "structlog==25.4.0",
  "uvicorn[standard]==0.37.0"
]

[project.optional-dependencies]
dev = [
  "pglast==8.4",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
